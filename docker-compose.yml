services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tokitomo
      POSTGRES_PASSWORD: tokitomo
      POSTGRES_DB: tokitomo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokitomo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
